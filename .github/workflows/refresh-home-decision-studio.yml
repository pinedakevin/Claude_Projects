name: Refresh Home Decision Studio data

on:
  schedule:
    # Fridays at 15:17 UTC (9:17 a.m. Mountain), the day after Freddie Mac's Thursday rate release
    - cron: "17 15 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-home-decision-studio
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Refresh data
        run: python home-decision-studio/scripts/refresh_data.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-decision-studio/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Home Decision Studio data"
            git push
          fi
